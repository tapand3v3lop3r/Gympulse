<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="dark light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GymPulse</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0B1220;--sf:#151F32;--sf2:#1B2740;--tx:#F8FAFC;--mu:#94A3B8;--bd:#26324A;--em:#10B981;--em2:#34D399;--on:#04211a;--red:#F87171;--amb:#FBBF24;--blu:#60A5FA;--sb:#0E1627;--sbt:#cbd5e1;--amt:var(--amt);--emt:var(--emt);--mwbg:#070C16;color-scheme:dark}
:root[data-theme="light"]{--bg:#F4F6F9;--sf:#FFFFFF;--sf2:#EEF2F7;--tx:#0F172A;--mu:#64748B;--bd:#E2E8F0;--em2:#059669;--red:#DC2626;--amb:#B45309;--blu:#2563EB;--sb:#FFFFFF;--sbt:#475569;--amt:#92400E;--emt:#065F46;--mwbg:#E5EAF1;color-scheme:light}
:root[data-theme="light"] .pp{color:color-mix(in srgb,var(--pc) 62%,#000)}:root[data-theme="light"] .Escalated{color:#7C3AED}:root[data-theme="light"] .ki{color:color-mix(in srgb,var(--c) 68%,#000)}:root[data-theme="light"] .lgo,:root[data-theme="light"] .sbh img{filter:invert(1) hue-rotate(180deg)}
:root[data-theme="light"] .btn.d{color:var(--red)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Plus Jakarta Sans",Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--em2);outline-offset:2px}
select option{background:var(--sf);color:var(--tx)}::placeholder{color:#64748b}
h1,h2,h3{margin:0;letter-spacing:-.2px}h1{font-size:24px}h2{font-size:17px}h3{font-size:15px}.mu{color:var(--mu)}.sm{font-size:13px}
.btn{border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:9px 14px;border-radius:10px;font-weight:600;transition:background .15s,border-color .15s}.btn:hover{background:var(--sf2);border-color:color-mix(in srgb,var(--bd) 65%,var(--tx))}
.btn.p{background:var(--em);border-color:var(--em);color:var(--on)}.btn.p:hover{background:var(--em2);border-color:var(--em2)}.btn.d{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,var(--bd))}.btn.w{width:100%;padding:13px;border-radius:12px}.btn:disabled{opacity:.5;cursor:default}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);min-height:42px;transition:border-color .15s}.in:focus{border-color:var(--em);outline:none}textarea.in{min-height:92px;resize:vertical}
.er{color:var(--red);font-size:13px;margin-top:4px}.fld{margin-bottom:14px}.fld>b{display:block;font-size:13px;margin-bottom:5px}
.bd{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:color-mix(in srgb,currentColor 14%,transparent);white-space:nowrap}
.Open,.High,.Overdue,.Safety{color:var(--red)}.InProgress,.Medium,.Demo{color:var(--amb)}.Resolved,.Appreciation{color:var(--em2)}.Low,.Suggestion{color:var(--mu)}.Complaint{color:var(--blu)}.Escalated{color:#A78BFA}
.sp{width:22px;height:22px;border:3px solid var(--bd);border-top-color:var(--em);border-radius:50%;animation:s .8s linear infinite;margin:30px auto}@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-weight:600}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px}
.fx{position:fixed;right:10px;top:calc(8px + env(safe-area-inset-top,0px));z-index:50;display:flex;gap:6px;align-items:center}.tgm{background:rgba(11,18,32,.85);border:1px solid var(--bd);color:#fff;border-radius:99px;padding:6px 9px;display:grid;line-height:0}.tg{display:inline-grid;place-items:center;padding:8px 10px;line-height:0}
.dl{background:rgba(11,18,32,.85);border:1px solid var(--bd);color:#fff;font-size:12px;font-weight:600;padding:6px 11px;border-radius:99px;text-decoration:none}
/* launcher */
.home{max-width:900px;margin:auto;padding:40px 16px}.hg{display:grid;grid-template-columns:1fr;gap:16px;margin:24px 0}@media(min-width:760px){.hg{grid-template-columns:1fr 1fr}}
.hc{display:block;text-decoration:none;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:26px;min-height:190px;transition:border-color .15s,transform .15s}.hc:hover{border-color:var(--em);transform:translateY(-2px)}.hc h2{font-size:21px;margin:12px 0 6px}.hc p{color:var(--mu);margin:0}
/* member */
.mw{min-height:100vh}
.mv{max-width:440px;margin:auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media(min-width:600px){.mw{padding:28px 16px;background:var(--mwbg)}.mv{min-height:820px;border-radius:30px;border:1px solid var(--bd);box-shadow:0 24px 60px rgba(0,0,0,.5)}}
.scr{animation:fi .28s ease both}@keyframes fi{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){.scr{animation:none}.opt,.mb,.star,.btn,.hc{transition:none!important}}
.hero{background:radial-gradient(90% 30% at 50% 100%,rgba(16,185,129,.12),transparent),#0B1220;color:#fff}
.ph{position:absolute;left:0;right:0;top:0;height:max(400px,50%);background-size:cover;background-position:62% 0;-webkit-mask-image:linear-gradient(180deg,#000 62%,transparent);mask-image:linear-gradient(180deg,#000 62%,transparent)}
.mlogo{height:30px;width:auto;align-self:flex-start;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}

.hin{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;padding:26px 22px 24px}
.hero h1{font-size:44px;line-height:1;font-weight:800;letter-spacing:-1.2px}.hero h1 span{color:var(--em2)}
.bs{position:relative;margin:0 0 12px}.bs svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--em2)}.bs:after{content:"▾";position:absolute;right:16px;top:50%;transform:translateY(-50%);pointer-events:none}
.bs select{width:100%;height:52px;border-radius:14px;padding:0 38px 0 44px;background:rgba(21,31,50,.85);border:1px solid rgba(255,255,255,.18);color:#fff;font-weight:600;appearance:none}
.mb{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:14px;border:0;background:var(--em);color:var(--on);font-weight:700;font-size:16px;transition:background .15s,transform .15s}
.mb:hover{background:var(--em2)}.mb:active{transform:scale(.98)}.mb:disabled{opacity:.6}.mb.o{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.7)}.mb.o:hover{background:rgba(255,255,255,.08)}.mb.w{background:var(--sf);color:var(--tx);border:1px solid var(--bd)}.mb.w:hover{background:var(--sf2)}
.pk{display:flex;margin-top:24px}.pk div{flex:1;text-align:center;font-size:12px;color:#cbd5e1;padding:0 6px}.pk div+div{border-left:1px solid rgba(255,255,255,.18)}.pk svg{display:block;margin:0 auto 6px;color:var(--em2)}
.mh{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 8px}.mh b{font-size:18px}.mh button{border:0;background:none;color:inherit;padding:4px;display:grid}
.s3{display:flex;align-items:center;justify-content:center;margin:8px 44px 20px}.s3 i{width:30px;height:30px;border-radius:50%;background:var(--sf);border:2px solid var(--bd);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:14px;color:var(--mu);flex:0 0 30px}.s3 i.on{background:var(--em);border-color:var(--em);color:var(--on)}.s3 u{flex:1;height:2px;background:var(--bd)}.s3 u.on{background:var(--em)}
.mc{padding:0 20px 20px;flex:1}.mf{padding:0 20px 24px}.q{font-size:20px;text-align:center;margin:10px 0 20px}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--sf);border:1.5px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px;transition:border-color .15s,background .15s}.opt:hover{border-color:color-mix(in srgb,var(--bd) 65%,var(--tx))}
.opt.on{border-color:var(--em);background:color-mix(in srgb,var(--em) 10%,var(--sf))}.opt b{display:block;font-size:17px}
.ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--em) 14%,transparent);color:var(--em2);flex:0 0 46px}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 18px}.cg .opt{flex-direction:column;gap:4px;margin:0;padding:12px 6px;text-align:center;font-size:13px;font-weight:600}.cg .ico{width:34px;height:34px;flex:0 0 34px;background:none}
.star{border:0;background:none;font-size:36px;line-height:1;color:var(--bd);padding:0 2px;transition:transform .12s}.star.on{color:#F5A524}.star:hover{transform:scale(1.12)}
.tbn{display:flex;gap:12px;align-items:center;background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:16px}.tbn .ico{width:38px;height:38px;flex:0 0 38px}.tbn>div{flex:1;min-width:0}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--mu);margin-bottom:12px}

.nx{background:var(--sf);border:1px solid var(--bd);color:var(--tx);border-radius:16px;padding:16px;text-align:left;margin-bottom:14px}.nx h3{display:flex;gap:8px;align-items:center}.nx ul{list-style:none;padding:0;margin:10px 0 0}.nx li{position:relative;padding-left:20px;margin:8px 0;font-size:14px;color:var(--mu)}.nx li:before{content:"";position:absolute;left:0;top:7px;width:9px;height:9px;border-radius:50%;background:var(--em)}.nx li+li:before{background:#475569}
.srch{display:flex;border:1.5px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--sf);margin-bottom:14px}.srch>svg{margin:13px 0 0 12px;flex:0 0 auto;color:var(--mu)}.srch input{flex:1;border:0;background:none;padding:12px;min-width:0;outline:none}.srch button{border:0;background:var(--em);color:var(--on);width:52px;display:grid;place-items:center}.srch:focus-within{border-color:var(--em)}
.tc{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}.mrow{display:flex;gap:8px;align-items:center;color:var(--mu);font-size:14px;margin-top:7px}
.mt{margin-top:12px}.mi{display:flex;gap:14px;padding-bottom:18px;position:relative}.mi:not(:last-child):before{content:"";position:absolute;left:11px;top:26px;bottom:-2px;width:2px;background:var(--bd)}.mi.done:not(:last-child):before{background:var(--em)}
.dot{width:24px;height:24px;border-radius:50%;flex:0 0 24px;display:grid;place-items:center;background:var(--sf);border:2px solid var(--bd)}.done .dot{background:var(--em);border-color:var(--em);color:var(--on)}.cur .dot{border:6px solid var(--blu)}
.note{background:color-mix(in srgb,var(--amb) 12%,transparent);color:var(--amt);border-radius:12px;padding:12px;margin-top:6px;display:flex;gap:8px;font-size:14px}.okc{background:color-mix(in srgb,var(--em) 14%,transparent);color:var(--emt);border-radius:12px;padding:12px;margin-top:6px}
.dbs{margin:0 -22px -28px;flex:0 0 96px;background-size:cover;background-position:center;background-color:#0E1627;-webkit-mask-image:linear-gradient(180deg,transparent,#000 55%);mask-image:linear-gradient(180deg,transparent,#000 55%)}
/* ops */
.sh{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh;background:var(--bg)}
.sb{background:var(--sb);border-right:1px solid var(--bd);color:var(--sbt);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden}
.sbh{padding:20px 16px 6px}.sbh img{height:30px;display:block}.sbh small{display:block;margin-top:6px;color:var(--mu);font-size:13px}
.chip{margin:8px 14px 6px;padding:9px 12px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;display:flex;gap:8px;align-items:center;font-weight:600;color:var(--tx);font-size:14px}.chip svg{color:var(--em2)}
.nav{padding:8px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.nv{display:flex;gap:12px;align-items:center;border:0;background:none;color:inherit;padding:10px 12px;border-radius:10px;text-align:left;font-weight:600;font-size:14.5px;width:100%;transition:background .15s,color .15s}
.nv.on{background:color-mix(in srgb,var(--em) 16%,transparent);color:var(--em2);box-shadow:inset 3px 0 0 var(--em)}.nv:hover:not(.on){background:color-mix(in srgb,var(--tx) 6%,transparent);color:var(--tx)}.nv b{margin-left:auto;background:#EF4444;color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.sbp{margin-top:auto;flex:0 0 140px;background-size:cover;background-position:center;background-color:var(--sb);position:relative;-webkit-mask-image:linear-gradient(180deg,transparent,#000 50%);mask-image:linear-gradient(180deg,transparent,#000 50%)}
.sbn{padding:0 16px 12px;font-size:12px;color:var(--mu);position:relative;z-index:1;margin-top:-30px}
.mn{min-width:0}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 24px;background:var(--bg);border-bottom:1px solid var(--bd);min-height:78px}
.hdr.pho{color:#fff}.hdr.pho .btn,.lgh .btn{background:rgba(11,18,32,.55);border-color:rgba(255,255,255,.22);color:#fff}.hdr.pho .btn:hover,.lgh .btn:hover{background:rgba(11,18,32,.75)}.hdr.pho .av{background:rgba(16,185,129,.22);color:#34D399;border-color:rgba(52,211,153,.4)}.hdr h1{font-size:23px}.hdr .mu{color:inherit;opacity:.8}
.who{display:flex;gap:10px;align-items:center}.av{width:36px;height:36px;border-radius:50%;background:color-mix(in srgb,var(--em) 22%,var(--sf));color:var(--em2);border:1px solid color-mix(in srgb,var(--em) 40%,transparent);display:grid;place-items:center;font-weight:700;font-size:13px;flex:0 0 36px}
.bell{position:relative;border:0;background:none;padding:6px;color:inherit;display:grid}.bell i{position:absolute;top:0;right:0;min-width:16px;height:16px;border-radius:99px;background:#EF4444;color:#fff;font-size:10px;font-style:normal;display:grid;place-items:center}
.ct{padding:20px 24px 40px}
.fbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;margin-bottom:16px}.fbar>svg{color:var(--mu)}
.hf{display:flex;gap:8px;flex-wrap:wrap;flex:1}.hf select{width:auto;min-width:140px;min-height:38px;padding:6px 10px;font-size:13px}
.kcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:18px}
.kc{--c:#10B981;display:flex;gap:14px;align-items:center;padding:16px;border-radius:14px;border:1px solid var(--bd);background:var(--sf)}
.ki{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);flex:0 0 46px}
.kc b{font-size:28px;line-height:1.05;letter-spacing:-.6px;display:block;margin-bottom:2px}.kc span{font-size:13.5px;font-weight:600;color:var(--mu)}.kc small{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:12.5px;font-weight:700;margin-top:4px}
.up{color:var(--em2)}.dn2{color:var(--red)}.fl0{color:var(--mu)}
.ch2{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}.lnk{color:var(--em2);font-weight:700;text-decoration:none;background:none;border:0;padding:0;font-size:13.5px}.lnk:hover{text-decoration:underline}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:13px 12px;border-bottom:1px solid var(--bd);vertical-align:middle}th{color:var(--mu);font-size:12px;font-weight:600;background:color-mix(in srgb,var(--bg) 55%,var(--sf));white-space:nowrap}tbody tr:last-child td{border-bottom:0}
tr.cl{cursor:pointer;transition:background .12s}tr.cl:hover{background:var(--sf2)}tr.cl.cur{background:color-mix(in srgb,var(--em) 12%,transparent);box-shadow:inset 3px 0 0 var(--em)}tr.cl.sfty{box-shadow:inset 3px 0 0 var(--red)}tr.cl.sfty:not(.cur){background:color-mix(in srgb,var(--red) 6%,transparent)}
.rid{font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.2px;white-space:nowrap}.stc{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}td .stc:first-child{margin-top:0}
.iss{min-width:200px;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nw{white-space:nowrap}.od{color:var(--red);font-weight:700}.un{color:var(--red);font-weight:700}
.pp{--pc:#94A3B8;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;white-space:nowrap;color:var(--pc);background:color-mix(in srgb,var(--pc) 14%,transparent);border:1px solid color-mix(in srgb,var(--pc) 32%,transparent)}.pp.sq{border-radius:6px}
.pp.High,.pp.Open{--pc:#F87171}.pp.Medium{--pc:#FBBF24}.pp.Low{--pc:#94A3B8}.pp.Resolved{--pc:#34D399}.pp.InProgress{--pc:#60A5FA}.pp.Overdue{--pc:#FB923C}.pp.Escalated{--pc:#A78BFA}.pp.Demo{--pc:#94A3B8}.pp.Complaint{--pc:#60A5FA}.pp.Suggestion{--pc:#FBBF24}.pp.Appreciation{--pc:#34D399}.pp.Safety{background:#F87171;border-color:#F87171;color:#2A0A0A}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 2px}.seg button{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--bd);background:var(--bg);padding:6px 12px;border-radius:99px;font-weight:600;font-size:13px;color:var(--mu);transition:border-color .15s,background .15s}.seg button:hover{border-color:var(--mu)}.seg button.on{border-color:var(--em);color:var(--tx);background:color-mix(in srgb,var(--em) 14%,transparent)}.ct2{opacity:.7;font-weight:700}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--bd);margin:14px 0 4px;overflow-x:auto}.tabs button{border:0;background:none;padding:9px 2px;font-weight:600;color:var(--mu);border-bottom:2px solid transparent;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}.tabs button.on{color:var(--tx);border-color:var(--em)}
.fl{display:flex;gap:8px;flex-wrap:wrap}.fl>*{flex:1;min-width:130px}
.srf{position:relative;flex:2 1 240px}.srf svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mu)}.srf input{padding-left:38px}
.g2{display:grid;gap:16px;grid-template-columns:1fr}@media(min-width:1000px){.g3{grid-template-columns:1fr 1fr!important}}.g2>.card{margin:0}
.mg1,.mg2{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);margin-bottom:16px}.mg1>.card,.mg2>.card{margin:0}
@media(min-width:900px){.mg1{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.mg1>:first-child{grid-column:1/-1}.mg2{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}}
@media(min-width:1400px){.mg1{grid-template-columns:minmax(0,1.6fr) minmax(0,1.1fr) minmax(0,1.1fr)}.mg1>:first-child{grid-column:auto}}
.empty{text-align:center;padding:34px 12px;color:var(--mu)}.bar{height:6px;border-radius:6px;background:var(--bd);overflow:hidden;min-width:70px;flex:1}.bar i{display:block;height:100%;background:var(--em);border-radius:6px}
.mono{width:32px;height:32px;border-radius:9px;display:inline-grid;place-items:center;font-size:12px;font-weight:700;color:#E2E8F0;flex:0 0 32px;margin-right:10px;vertical-align:middle;letter-spacing:.3px}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mu);margin-bottom:6px}.leg span{display:inline-flex;gap:6px;align-items:center}.leg i{width:14px;border-radius:3px;display:inline-block}
.ins{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px;font-size:13.5px}.ins .ki{width:38px;height:38px;flex:0 0 38px}.ins .lnk{margin-top:4px;display:inline-block}
.sumb{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.sumb div{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;min-width:130px}.sumb b{font-size:22px;display:block;line-height:1.1}.sumb span{font-size:12.5px;color:var(--mu)}
.ov{position:fixed;inset:0;background:rgba(3,7,14,.65);z-index:40;display:flex;justify-content:flex-end}.dr{background:var(--sf);border-left:1px solid var(--bd);width:min(520px,100%);height:100%;overflow:auto;padding:20px}.md{margin:auto;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:20px;width:min(360px,92%);text-align:center}
.act{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.act .btn{flex:1;padding:12px;display:flex;gap:8px;align-items:center;justify-content:center;white-space:nowrap}
.tl{border-left:2px solid var(--bd);margin:8px 0 0 6px;padding-left:16px}.tl>div{position:relative;margin-bottom:14px}.tl>div:before{content:"";position:absolute;left:-23px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--em)}.tl .gi:before{background:#64748b}
.lock{background:color-mix(in srgb,var(--amb) 12%,transparent);color:var(--amt);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px;display:flex;gap:8px;align-items:center}.vis{background:color-mix(in srgb,var(--em) 12%,transparent);color:var(--emt);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.lg{max-width:780px;margin:30px auto;padding:0 16px}.lgh{border-radius:18px;padding:28px 26px;color:#fff;margin-bottom:16px;background-size:cover;background-position:center;background-color:#0E1627;border:1px solid var(--bd)}.lgh img{height:34px}.lgh h1{margin-top:14px}
.dis{background:color-mix(in srgb,var(--amb) 12%,transparent);color:var(--amt);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:12px}
@media(max-width:900px){.sh{grid-template-columns:minmax(0,1fr)}.sb{position:static;height:auto;border-right:0;border-bottom:1px solid var(--bd)}.sbp,.sbn,.chip{display:none}.sbh{padding:12px 14px 4px}.nav{flex-direction:row;flex-wrap:wrap;padding:8px 10px}.nv{width:auto;padding:8px 10px;font-size:14px}.hdr{padding:12px 14px}.ct{padding:14px}.nv.on{box-shadow:none}}

<body><div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
/* ===== shared data model & business logic (shared.js equivalent) ===== */
const {useState,useEffect}=React;
const R=(t,p,...c)=>{if(p&&p.class){p={...p,className:p.class};delete p.class}return React.createElement(t,p,...c)};
const h=htm.bind(R);
const KEY="gp2",H=36e5,D=24*H,now=()=>Date.now();
const CATS=["Equipment","Cleanliness","Trainer","Staff Behaviour","Hygiene","Billing","Facilities","Other"];
const CI={Equipment:"🏋️",Cleanliness:"✨",Trainer:"🧑‍🏫","Staff Behaviour":"🤝",Hygiene:"🧼",Billing:"💳",Facilities:"🏢",Other:"⋯"};
const TYPES=[["Complaint","Report an Issue","Something isn’t working well","⚠️"],["Suggestion","Share a Suggestion","Have an idea to improve?","💡"],["Appreciation","Appreciate Someone","Recognise a great experience","❤️"]];
const STAT=["Open","In Progress","Resolved"],SLA={High:24*H,Medium:72*H,Low:168*H};
const SAFE=/injur|hurt|bleed|harass|unsafe|safety|spark|shock|exposed wir|inappropriate|touched me|theft|stolen|faint|snapped|collaps|fell |frayed|wobbl/i;
const classify=(type,rating,desc)=>{const safety=type==="Complaint"&&SAFE.test(desc);return{safety,priority:type!=="Complaint"?"Low":safety||rating<=2?"High":"Medium"}};
const dueOf=i=>i.created+(i.safety?8*H:i.type==="Suggestion"?14*D:SLA[i.priority]);
const overdue=i=>i.type==="Complaint"&&i.status!=="Resolved"&&now()>dueOf(i);
const ACK="Thank you. Your note was shared with the branch team.";
const SL=(t,x)=>t==="Suggestion"?{Open:"New","In Progress":"Under review",Resolved:"Closed"}[x]:t==="Appreciation"?(x==="Resolved"?"Acknowledged":"New"):x;
const ackFix=i=>({...i,ack:true,esc:false,assignee:"",priority:"Low",status:"Resolved",resolved:i.created,resolution:ACK,log:[{t:i.created,by:"Member",txt:"Feedback received",k:"sys"},{t:i.created,by:"System",txt:ACK,k:"pub"},{t:i.created,by:"System",txt:"Status changed to Resolved",k:"sys"}]});
const norm=s=>({...s,items:s.items.map(i=>i.type==="Appreciation"&&!i.ack?ackFix(i):i)});
const dur=ms=>ms<48*H?Math.max(1,Math.round(ms/H))+"h":(ms/D).toFixed(1)+"d";
const ago=t=>dur(now()-t)+" ago";
const fmt=t=>new Date(t).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const L=(i,by,txt,k)=>{i.log=[...i.log,{t:now(),by,txt,k}];return i};/* k: sys (public status) | pub (public message) | int (internal event) | note (internal note) */
const pr=a=>a.map(x=>[x,x]);
const C={Equipment:["Treadmill 3 stopped mid-run and the display keeps flickering.","Dumbbells above 20 kg are missing from the rack most evenings.","The lat pulldown cable is frayed and snapped mid-set; I got hurt."],Cleanliness:["Floor near the cable machines was sticky and not mopped all morning.","Dustbins in the cardio zone were overflowing at 7 pm."],Trainer:["My trainer was on his phone during the paid PT session.","Nobody corrected my deadlift form even after I asked twice."],"Staff Behaviour":["Front desk was rude when my card failed at the turnstile.","A trainer made inappropriate comments to me in the stretching area."],Hygiene:["Shower drains are clogged and the area smells bad.","Towels provided were damp and unwashed."],Billing:["I was charged twice for my quarterly renewal.","GST was added to my plan although the quote said inclusive."],Facilities:["AC in the main hall has not worked for three days.","Exposed wiring near the water cooler sparks when touched.","Lockers 12 to 20 have broken locks."],Other:["Parking is chaotic after 6 pm and bikes block the exit.","Music in the group class room is far too loud."]};
const SG=["Please add more squat racks for the 6–8 pm rush.","A protein shake counter near reception would be great.","Extend weekend opening hours to 10 pm.","Add a women-only slot for the free-weights area."];
const AP=["Coach Arjun’s Saturday HIIT class is fantastic and motivating.","The new cardio zone is spotless and well organised.","Reception sorted my freeze request in two minutes. Thank you!","Great atmosphere and well-maintained equipment."];
const NT=[["Part replaced by vendor; tested on site.","We’ve replaced the faulty part and tested it. Thanks for flagging it."],["Housekeeping roster revised; supervisor checks added.","We’ve updated our cleaning routine for this area."],["Discussed with the team; coaching given.","We’ve followed up with the team member concerned."],["Refund initiated via finance.","A refund has been initiated and will reflect in 5–7 working days."]];
const B0=[["IND","Indiranagar","Rahul Menon",["Rahul Menon","Priya Nair","Karthik S"]],["KOR","Koramangala","Ananya Rao",["Ananya Rao","Dev Malhotra","Sana Sheikh"]],["WHF","Whitefield","Vikram Shetty",["Vikram Shetty","Lakshmi N","Joseph Mathew"]],["HSR","HSR Layout","Meera Iyer",["Meera Iyer","Nikhil Gowda","Farah Ali"]],["JAY","Jayanagar","Suresh Kumar",["Suresh Kumar","Deepa Bhat","Manoj R"]]].map(([id,name,mgr,staff])=>({id,name,mgr,staff,active:true}));
function mk(){let s=11;const r=()=>(s=s*16807%2147483647)/2147483647,pk=a=>a[Math.floor(r()*a.length)],t0=now(),items=[];
const nm=["Aditya Sharma","Neha Kapoor","Rohan Das","Sneha Pillai","Imran Khan","Divya Reddy","Arun Prakash","Pooja Hegde"];
for(let i=0;i<64;i++){const b=pk(B0),x=r(),type=x<.7?"Complaint":x<.85?"Suggestion":"Appreciation",cat=pk(CATS),rating=type==="Complaint"?1+Math.floor(r()*3):type==="Suggestion"?3+Math.floor(r()*2):4+Math.floor(r()*2),
desc=type==="Complaint"?pk(C[cat]):pk(type==="Suggestion"?SG:AP),age=r()*30*D,created=t0-age,anon=r()<.3,y=r(),status=age>10*D?(y<.8?"Resolved":"In Progress"):y<.3?"Resolved":y<.6?"In Progress":"Open",cl=classify(type,rating,desc);
const it={id:"GP-"+(48210+i*37),branch:b.id,cat,type,rating,desc,name:anon?"":pk(nm),contact:!anon&&r()<.6?"9"+String(Math.floor(r()*1e9)).padStart(9,"0"):"",anon,created,status,...cl,demo:true,assignee:"",esc:false,log:[{t:created,by:"Member",txt:"Feedback received",k:"sys"}]};
if(status!=="Open"){const a=created+Math.min(2*H,age/2);it.assignee=pk(b.staff);it.log.push({t:a,by:b.mgr,txt:"Assigned to "+it.assignee,k:"int"},{t:a,by:it.assignee,txt:"Status changed to In Progress",k:"sys"})}
if(status==="Resolved"){const n=pk(NT);it.resolved=Math.min(t0,created+(6+r()*90)*H);it.resolution=n[1];it.log.push({t:it.resolved-2,by:it.assignee,txt:n[0],k:"note"},{t:it.resolved-1,by:it.assignee,txt:n[1],k:"pub"},{t:it.resolved,by:it.assignee,txt:"Status changed to Resolved",k:"sys"})}
else if(overdue(it)&&r()<.35){it.esc=true;it.priority="High";it.log.push({t:Math.max(created+1,t0-r()*3*D),by:"Management",txt:"Escalated to branch manager",k:"sys"})}
items.push(it)}
return norm({items:items.sort((a,b)=>b.created-a.created),branches:B0})}
function useStore(){const[s,set]=useState(()=>{try{const v=localStorage.getItem(KEY);if(v)return norm(JSON.parse(v))}catch(e){}return mk()});
useEffect(()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}},[s]);
useEffect(()=>{const f=e=>{if(e.key===KEY&&e.newValue)try{set(norm(JSON.parse(e.newValue)))}catch(x){}};addEventListener("storage",f);return()=>removeEventListener("storage",f)},[]);return[s,set]}
/* ---- Deployment settings (QR codes and shareable links) ----
   PUBLIC_URL: your live address, e.g. "https://gympulse.vercel.app". Set it so printed QR codes always point there.
               Leave "" to use the address the page is opened from.
   PATH_LINKS: true gives short QR links like https://your-site/m/KOR (needs the rewrite in vercel.json).
               false gives https://your-site/#member-KOR (works on any static host). */
const PUBLIC_URL="",PATH_LINKS=false;
const link=id=>PATH_LINKS?(PUBLIC_URL?PUBLIC_URL.replace(/\/+$/,""):location.origin)+"/m/"+encodeURIComponent(id):(PUBLIC_URL?PUBLIC_URL.replace(/\/+$/,"")+"/":location.href.split("#")[0])+"#member-"+encodeURIComponent(id);

/* ===== shared UI ===== */
const Bd=({k,l})=>h`<span class=${"bd "+k.replace(" ","")}>${l||k}</span>`;
const Pri=({i})=>h`<span><${Bd} k=${i.priority}/>${i.safety&&h` <${Bd} k="Safety" l="⚑ Safety"/>`}</span>`;
const Stars=({n})=>!n?h`<span class="mu">–</span>`:h`<span style=${{color:"#f5a524",letterSpacing:1}}>${"★".repeat(n)}<span style=${{color:"var(--bd)"}}>${"★".repeat(5-n)}</span></span>`;
const Sel=({v,on,o,ph})=>h`<select class="in" value=${v} onChange=${e=>on(e.target.value)} aria-label=${ph}><option value="">${ph}</option>${o.map(x=>h`<option key=${x[0]} value=${x[0]}>${x[1]}</option>`)}</select>`;
const Spin=()=>h`<div class="sp" role="status" aria-label="Loading"></div>`;
const Logo=()=>h`<img class="lgo" src=${LOGO_IMG} alt="GymPulse" style=${{height:30}}/>`;
function QRCode({id}){const u=link(id);let svg="";try{const q=qrcode(0,"M");q.addData(u);q.make();svg=q.createSvgTag({cellSize:5,margin:2})}catch(e){}
return h`<div><div style=${{background:"#fff",borderRadius:12,padding:6,width:"fit-content",margin:"auto"}} dangerouslySetInnerHTML=${{__html:svg||"QR unavailable"}}></div><p class="sm mu" style=${{wordBreak:"break-all"}}>${u}</p></div>`}

try{document.documentElement.setAttribute("data-theme",localStorage.getItem("gp_theme")==="light"?"light":"dark")}catch(e){document.documentElement.setAttribute("data-theme","dark")}

function Track({s,q0}){
const[q,setQ]=useState(q0||""),[res,setRes]=useState(null),[busy,setBusy]=useState(false);
function go(e,v){e&&e.preventDefault();const id=(v||q).trim().toUpperCase();if(!id)return;setBusy(true);setRes(null);setTimeout(()=>{setBusy(false);setRes(s.items.find(i=>i.id===id)||{err:id})},450)}
useEffect(()=>{if(q0)go(null,q0)},[q0]);
const it=res&&!res.err&&res,pub=it?it.log.filter(l=>l.k==="sys"||l.k==="pub"):[],when=t=>{const l=it.log.find(x=>x.k==="sys"&&x.txt==="Status changed to "+t);return l?fmt(l.t):""};
const last=it&&pub.length?pub[pub.length-1].t:0,st=it?STAT.indexOf(it.status):0,msgs=it?pub.filter(l=>l.k==="pub"&&l.txt!==it.resolution):[];
const Step=({c,t,d,x})=>h`<div class=${"mi "+c}><div class="dot">${c==="done"&&h`<${Ic} n="check" s=${14} w=3/>`}</div><div><b>${t}</b><div class="sm mu">${d}</div>${x}</div></div>`;
return h`<div><form class="srch" onSubmit=${go}><${Ic} n="search" s=${20}/><input value=${q} onInput=${e=>setQ(e.target.value)} placeholder="Enter reference ID, e.g. GP-42791" aria-label="Reference ID"/><button aria-label="Check status"><${Ic} n="search" s=${20}/></button></form>
${busy&&h`<${Spin}/>`}${res&&res.err&&h`<div class="tc" role="alert"><b style=${{color:"var(--red)"}}>We couldn’t find ${res.err}</b><div class="sm mu">Check the ID for typos. It looks like GP-123456.</div></div>`}
${it&&h`<div><div class="tc"><div style=${{display:"flex",justifyContent:"space-between",alignItems:"center"}}><h2>${it.id}</h2><${Bd} k=${it.status} l=${SL(it.type,it.status)}/></div>
${it.cat&&h`<div class="mrow"><${Ic} n=${CIC[it.cat]} s=${16}/> ${it.cat}</div>`}<div class="mrow"><${Ic} n="pin" s=${16}/> ${s.branches.find(b=>b.id===it.branch).name} Branch</div><div class="mrow"><${Ic} n="cal" s=${16}/> Submitted: ${fmt(it.created)}</div><div class="mrow"><${Ic} n="clock" s=${16}/> Last update: ${fmt(last)}</div></div>
<h2 style=${{margin:"18px 0 4px"}}>Status Timeline</h2><div class="mt">
<${Step} c="done" t="Submitted" d=${fmt(it.created)+" · We’ve received your feedback."}/>
${it.type==="Appreciation"?h`<${Step} c="done" t="Acknowledged" d=${fmt(it.resolved||it.created)+" · Shared with the branch team."} x=${h`<div class="okc">${it.resolution||ACK}</div>`}/>`:h`<${Step} c=${st===0?"":st===1?"cur":"done"} t=${it.type==="Suggestion"?"Under review":"In Progress"} d=${st===0?(it.type==="Suggestion"?"Waiting to be reviewed.":"Waiting for the branch team."):when("In Progress")+(it.type==="Suggestion"?" · The team is reviewing your idea.":" · Our team is working on it.")}/><${Step} c=${st===2?"done":""} t=${st===2?(it.type==="Suggestion"?"Closed":"Resolved"):(it.type==="Suggestion"?"Outcome (pending)":"Resolution (Pending)")} d=${st===2?fmt(it.resolved):(it.type==="Suggestion"?"Review by: ":"Expected by: ")+fmt(dueOf(it))} x=${st===2&&it.resolution&&h`<div class="okc">${it.resolution}</div>`}/>`}</div>
${msgs.map((l,k)=>h`<div key=${k} class="tc" style=${{padding:12}}><div>${l.txt}</div><div class="sm mu">Update · ${fmt(l.t)}</div></div>`)}
${st<2&&h`<div class="note"><${Ic} n="info" s=${18}/> Check back here with your reference ID. The resolution will appear once the team completes it.</div>`}</div>`}</div>`}
